[package]
name = "quadrant_next"
version = "26.1.0-stable"
description = "An easy way to manage your Minecraft mods and modpacks"
authors = ["Demir Yerli <me@mrquantumoff.dev>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quadrant_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["proprietary"]
telemetry = []
curseforge = []
# Quadrant ID/Sync/Share
quadrant_id = []
proprietary = ["telemetry", "curseforge", "quadrant_id"]


[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }


[dependencies]

tauri = { version = "2.9.5", features = ["tray-icon", "config-json5"] }

tauri-plugin-opener = "2.5.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
chrono = { version = "0.4.42", features = ["serde"] }
anyhow = { version = "1.0.100" }
dirs = "6.0.0"
log = "0.4.29"
tauri-plugin-fs = { version = "2.4.4", features = ["watch"] }
tauri-plugin-os = "2.3.2"
rss = "2.0.12"
tauri-plugin-store = "2.4.1"
uuid = { version = "1.19.0", features = ["v7"] }
tauri-plugin-http = "2.5.4"
tokio = { version = "1.49.0", features = ["full"] }
urlencoding = "2.1.3"
open = "5.3.3"
futures = { version = "0.3.31" }
sha1 = "0.10.6"
hex = "0.4.3"
colog = "1.4.0"
tauri-plugin-deep-link = { git = "https://github.com/mrquantumoff/plugins-workspace.git", branch = "single-instance" }
tauri-plugin-dialog = "2.4.2"
keyring = { version = "3.6.3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-persisted-scope = "2.3.4"
http-cache-reqwest = { version = "0.16.0", default-features = false, features = [
    "manager-moka",
] }
reqwest-middleware = "0.4.2"
tauri-plugin-oauth = "2"
zip = "7.0.0"


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { git = "https://github.com/mrquantumoff/plugins-workspace.git", branch = "single-instance", features = [
    "deep-link",
    "conventional-dbus",
] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-cli = "2.4.1"
tauri-plugin-updater = "2.9.0"

[profile.dev]
opt-level = 0
overflow-checks = false


[profile.release]
opt-level = 3
overflow-checks = true
codegen-units = 1
lto = "fat"
