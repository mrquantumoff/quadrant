[package]
name = "quadrant-core"
version = "0.1.0"
edition = "2024"

[features]
default = []
curseforge = []

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.32"
hex = "0.4.3"
log = "0.4.29"
reqwest = { version = "0.13.2", features = ["json", "rustls", "cookies", "query", "form", "stream"] }
rss = "2.0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
tokio = { version = "1.50.0", features = ["sync"] }
urlencoding = "2.1.3"
uuid = { version = "1.21.0", features = ["v7"] }
zip = "8.2.0"

[dev-dependencies]
httpmock = "0.7.0"
tempfile = "3.23.0"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "sync"] }
