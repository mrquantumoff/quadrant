[package]
name = "quadrant-napi"
version.workspace = true
edition = "2024"
build = "build.rs"

[features]
default = ["proprietary"]
curseforge = ["quadrant-host/curseforge"]
telemetry = []
quadrant_id = []
proprietary = ["curseforge", "telemetry", "quadrant_id"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = [
    "napi8",
    "tokio_rt",
    "serde-json",
] }
napi-derive = "3"
quadrant-host = { path = "../quadrant-host" }
serde_json = "1.0.149"
tokio = { version = "1.51.0", features = ["full"] }

[build-dependencies]
napi-build = "2"
