name: Validate Desktop

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release

jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # quadrant-core still uses compile-time env!() for these desktop-only
      # credentials, so CI must provide placeholder values for every Rust build.
      QUADRANT_API_KEY: dev
      QUADRANT_OAUTH2_CLIENT_ID: dev
      QUADRANT_OAUTH2_CLIENT_SECRET: dev
      ETERNAL_API_TOKEN: dev
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev xdg-utils libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev appstream desktop-file-utils

      - name: Validate Linux metadata
        run: |
          appstreamcli validate --no-net dev.mrquantumoff.mcmodpackmanager.metainfo.xml
          desktop_file="$(mktemp --suffix=.desktop)"
          trap 'rm -f "$desktop_file"' EXIT
          sed \
            -e 's/{{categories}}/Game;/' \
            -e 's/{{comment}}/Manage Minecraft mods and modpacks/' \
            -e 's/{{exec}}/quadrant_next/' \
            -e 's/{{icon}}/dev.mrquantumoff.mcmodpackmanager/' \
            -e 's/{{name}}/Quadrant/' \
            Quadrant.desktop > "$desktop_file"
          desktop-file-validate "$desktop_file"

      - name: Install frontend dependencies
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build shared renderer
        run: bun run build

      - name: Build Tauri shell
        run: bun tauri build --no-bundle

  validate-macos:
    runs-on: macos-latest
    env:
      QUADRANT_API_KEY: dev
      QUADRANT_OAUTH2_CLIENT_ID: dev
      QUADRANT_OAUTH2_CLIENT_SECRET: dev
      ETERNAL_API_TOKEN: dev
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build shared renderer
        run: bun run build

      - name: Build Apple-Silicon Tauri shell
        run: bun tauri build --no-bundle --target aarch64-apple-darwin
