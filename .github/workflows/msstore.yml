# @format

name: "Build for Microsoft Store"

on:
  push:
    tags:
      - "v*-stable"
      - "v*-msstore"

jobs:
  build-msstore:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          # - platform: "windows-11-arm"
          #   args: ""
    runs-on: ${{ matrix.platform }}
    outputs:
      assets: ${{ steps.tauri.outputs.releaseUploadUrl }}
      version: ${{ steps.tauri.outputs.appVersion }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Setup MSbuild
        uses: microsoft/setup-msbuild@v2
      - name: Install msixbundle-cli
        run: cargo install msixbundle-cli

      - name: Build the app
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETERNAL_API_TOKEN: ${{ secrets.ETERNAL_API_TOKEN }}
          QUADRANT_API_KEY: ${{ secrets.QUADRANT_API_KEY }}
          QUADRANT_OAUTH2_CLIENT_ID: ${{ secrets.QUADRANT_OAUTH2_CLIENT_ID }}
          QUADRANT_OAUTH2_CLIENT_SECRET: ${{ secrets.QUADRANT_OAUTH2_CLIENT_SECRET }}
        run: |
          rustup target add aarch64-pc-windows-msvc
          bun tauri build --config src-tauri/tauri.msstore.conf.json
          bun tauri build --config src-tauri/tauri.winarm.conf.json --target aarch64-pc-windows-msvc
          powershell -NoProfile -ExecutionPolicy Bypass -File .\msixbuild.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: quadrant_msstore
          path: "AppxBundles/*"
