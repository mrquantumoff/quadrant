# @format

name: "Build for Microsoft Store"

on:
  push:
    tags:
      - "v*-stable"
      - "v*-msstore"

jobs:
  build-msstore:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    outputs:
      assets: ${{ steps.tauri.outputs.releaseUploadUrl }}
      version: ${{ steps.tauri.outputs.appVersion }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Setup MSbuild
        uses: microsoft/setup-msbuild@v2
      - name: Locate Windows SDK tools
        shell: pwsh
        run: |
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $makeappx = Get-ChildItem -Path $kitRoot -Filter makeappx.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          $makepri = Get-ChildItem -Path $kitRoot -Filter makepri.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) {
            throw 'makeappx.exe not found in Windows Kits install.'
          }
          if (-not $makepri) {
            throw 'makepri.exe not found in Windows Kits install.'
          }
          "MAKEAPPX_PATH=$($makeappx.FullName)" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          "MAKEPRI_PATH=$($makepri.FullName)" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the app
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETERNAL_API_TOKEN: ${{ secrets.ETERNAL_API_TOKEN }}
          QUADRANT_API_KEY: ${{ secrets.QUADRANT_API_KEY }}
          QUADRANT_OAUTH2_CLIENT_ID: ${{ secrets.QUADRANT_OAUTH2_CLIENT_ID }}
          QUADRANT_OAUTH2_CLIENT_SECRET: ${{ secrets.QUADRANT_OAUTH2_CLIENT_SECRET }}
        run: |
          bun tauri build --config src-tauri/tauri.msstore.conf.json

      - name: Generate resource index
        shell: pwsh
        run: |
          Remove-Item -Path resources.pri -ErrorAction SilentlyContinue
          & $env:MAKEPRI_PATH new /pr . /cf .\priconfig.xml /mn .\AppxManifest.xml /of .\resources.pri /o

      - name: Create MSIX package
        shell: pwsh
        run: |
          & $env:MAKEAPPX_PATH pack /m .\AppxManifest.xml /f .\AppxMappings.txt /p quadrant.msix /o

      - uses: actions/upload-artifact@v4
        with:
          name: quadrant_msstore.msix
          path: "*.msix"
