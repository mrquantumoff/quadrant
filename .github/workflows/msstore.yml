# @format

name: "Build for Microsoft Store"

on:
  push:
    tags:
      - "v*-stable"
      - "v*-msstore"

jobs:
  build-msstore:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    outputs:
      assets: ${{ steps.tauri.outputs.releaseUploadUrl }}
      version: ${{ steps.tauri.outputs.appVersion }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust for ARM
        run:  rustup target add aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Setup MSbuild
        uses: microsoft/setup-msbuild@v2

      - name: Build the app
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETERNAL_API_TOKEN: ${{ secrets.ETERNAL_API_TOKEN }}
          QUADRANT_API_KEY: ${{ secrets.QUADRANT_API_KEY }}
          QUADRANT_OAUTH2_CLIENT_ID: ${{ secrets.QUADRANT_OAUTH2_CLIENT_ID }}
          QUADRANT_OAUTH2_CLIENT_SECRET: ${{ secrets.QUADRANT_OAUTH2_CLIENT_SECRET }}
        run: |
          mkdir output
          bun tauri build --config src-tauri/tauri.msstore.conf.json
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe" pack /m .\AppxManifest.xml /f .\AppxMappings.txt /p .\output\quadrant.msix /o
          bun tauri build --config src-tauri/tauri.msstore.conf.json
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe" pack /m .\AppxManifest.xml /f .\AppxMappings.txt /p .\output\quadrant_arm64.msix /o
      - name: Create zip
        uses: ihiroky/archive-action@v1
        with:
          root_dir: output

      - uses: actions/upload-artifact@v4
        with:
          name: output.zip
          path: msstore.zip
