# @format

name: Release

on:
  push:
    tags:
      - "v*"
      - "v*-standalone"

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  ensure-release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            exit 0
          fi

          version="${TAG_NAME#v}"
          prerelease_flag=()
          if [[ "$TAG_NAME" != *stable ]]; then
            prerelease_flag+=(--prerelease)
          fi

          gh release create "$TAG_NAME" \
            --repo "$REPO" \
            --title "Quadrant v${version}" \
            --notes "See the assets to download this version and install. Check out the [changelog on my blog](https://blog.mrquantumoff.dev)" \
            "${prerelease_flag[@]}"

  publish-tauri:
    needs: ensure-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "blacksmith-4vcpu-ubuntu-2404"
            args: ""
          - platform: "blacksmith-4vcpu-windows-2025"
            args: ""
          - platform: "blacksmith-4vcpu-ubuntu-2404-arm"
            args: ""
          - platform: "windows-11-arm"
            args: ""

    runs-on: ${{ matrix.platform }}
    outputs:
      assets: ${{steps.tauri.outputs.releaseUploadUrl}}
      version: ${{steps.tauri.outputs.appVersion}}
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev xdg-utils libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - name: install frontend dependencies (bun)
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ETERNAL_API_TOKEN: ${{ secrets.ETERNAL_API_TOKEN }}
          QUADRANT_API_KEY: ${{ secrets.QUADRANT_API_KEY }}
          QUADRANT_OAUTH2_CLIENT_ID: ${{ secrets.QUADRANT_OAUTH2_CLIENT_ID }}
          QUADRANT_OAUTH2_CLIENT_SECRET: ${{ secrets.QUADRANT_OAUTH2_CLIENT_SECRET }}
          NO_STRIP: ${{ contains(matrix.platform, 'ubuntu') && 'true' }}
        with:
          releaseName: "Quadrant v__VERSION__"
          releaseBody: "See the assets to download this version and install. Check out the [changelog on my blog](https://blog.mrquantumoff.dev)"
          releaseDraft: false
          prerelease: ${{ !endsWith(github.ref_name, 'stable') }}
          args: ${{ matrix.args }}
          tauriScript: "bun tauri"
          tagName: ${{github.ref_name}}

  publish-electron:
    needs: ensure-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "blacksmith-4vcpu-windows-2025"
            os: "windows"
            arch: "x64"
          - platform: "blacksmith-4vcpu-ubuntu-2404"
            os: "linux"
            arch: "x64"
          - platform: "windows-11-arm"
            os: "windows"
            arch: "arm64"
          - platform: "blacksmith-4vcpu-ubuntu-2404-arm"
            os: "linux"
            arch: "arm64"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y xdg-utils libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libsecret-1-dev libarchive-tools rpm fakeroot 

      - name: install frontend dependencies (bun)
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Package Electron app
        env:
          ETERNAL_API_TOKEN: ${{ secrets.ETERNAL_API_TOKEN }}
          QUADRANT_API_KEY: ${{ secrets.QUADRANT_API_KEY }}
          QUADRANT_OAUTH2_CLIENT_ID: ${{ secrets.QUADRANT_OAUTH2_CLIENT_ID }}
          QUADRANT_OAUTH2_CLIENT_SECRET: ${{ secrets.QUADRANT_OAUTH2_CLIENT_SECRET }}
          QUADRANT_API_BASE_URL: ${{ vars.QUADRANT_API_BASE_URL }}
        run: bun run package:electron -- --arch=${{ matrix.arch }}

      - name: Upload Electron assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' files < <(
            if [[ "${{ matrix.os }}" == "windows" ]]; then
              find dist-electron -maxdepth 1 -type f -not -name 'latest.yml' -print0
            else
              find dist-electron -maxdepth 1 -type f -print0
            fi
          )
          gh release upload "$TAG_NAME" "${files[@]}" --clobber --repo "$REPO"

      - name: Upload Windows Electron update metadata
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-${{ matrix.arch }}-latest-yml
          path: dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 1

  publish-electron-windows-metadata:
    needs: publish-electron
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download Windows x64 update metadata
        uses: actions/download-artifact@v4
        with:
          name: electron-windows-x64-latest-yml
          path: artifacts/windows-x64

      - name: Download Windows arm64 update metadata
        uses: actions/download-artifact@v4
        with:
          name: electron-windows-arm64-latest-yml
          path: artifacts/windows-arm64

      - name: Install Python YAML dependency
        run: python3 -m pip install --user PyYAML

      - name: Merge Windows Electron update metadata
        run: |
          python3 scripts/merge-electron-latest-yml.py \
            --base artifacts/windows-x64/latest.yml \
            --extra artifacts/windows-arm64/latest.yml \
            --output artifacts/windows/latest.yml

      - name: Upload merged Windows latest.yml to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG_NAME" artifacts/windows/latest.yml --clobber --repo "$REPO"

  sync_flathub:
    name: Sync Flathub
    needs: publish-electron-windows-metadata
    if: endsWith(github.ref_name, '-stable') || endsWith(github.ref_name, '-flatpak')
    uses: ./.github/workflows/flatpak.yml@next
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}

  submit_update:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: publish-tauri
    if: endsWith(github.ref_name, '-flatpak') == false || endsWith(github.ref_name, '-msstore') == false
    steps:
      - name: Parse semver string
        id: semver_parser
        uses: booxmedialtd/ws-action-parse-semver@v1
        with:
          input_string: ${{github.ref_name}}
      - uses: winterjung/split@v2
        id: split
        with:
          msg: ${{steps.semver_parser.outputs.prerelease}}
          separator: "."
      - env:
          VERSION: ${{github.ref_name}}
          CHANNEL: ${{steps.split.outputs._0}}
        run: |
          curl -X PUT --header 'Authorization: ${{secrets.VERSION_UPDATE_TRIGGER_TOKEN}}' https://api.usequadrant.dev/api/any/quadrant/add_updates/$CHANNEL/$VERSION
